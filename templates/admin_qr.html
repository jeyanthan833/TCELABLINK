<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Print QR Label | {{ item.id }} - {{ item.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Dedicated Print Label Styling */
    .print-page-wrapper {
      max-width: 520px;
      margin: 40px auto;
      text-align: center;
    }

    .print-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .qr-physical-tag {
      background: #fff;
      border: 2px dashed #000;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      page-break-inside: avoid;
    }

    .tag-header {
      border-bottom: 2px solid #182230;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .tag-brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #315efb;
      text-transform: uppercase;
    }

    .tag-title {
      font-size: 24px;
      margin: 6px 0 2px;
      font-weight: 800;
      color: #182230;
    }

    .tag-code {
      display: inline-block;
      font-size: 18px;
      font-weight: 800;
      background: #f0f4ff;
      color: #182230;
      padding: 4px 12px;
      border-radius: 6px;
      margin: 8px 0;
      border: 1px solid #d0d7e2;
    }

    .qr-large-frame {
      margin: 16px auto;
      display: inline-block;
      padding: 12px;
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
    }

    .qr-large-frame img {
      width: 240px;
      height: 240px;
      display: block;
    }

    .tag-meta {
      font-size: 13px;
      color: #475467;
      margin-top: 14px;
      line-height: 1.5;
    }

    .tag-instructions {
      font-size: 11px;
      color: #98a2b3;
      margin-top: 16px;
      border-top: 1px dotted #ccc;
      padding-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    @media print {
      body {
        background: #fff;
        margin: 0;
        padding: 0;
      }

      .print-actions,
      header,
      footer {
        display: none !important;
      }

      .print-page-wrapper {
        margin: 0;
        max-width: 100%;
      }

      .qr-physical-tag {
        border: 2px dashed #000 !important;
        box-shadow: none !important;
        width: 100%;
        max-width: 420px;
        margin: 20px auto;
      }
    }
  </style>
</head>

<body style="background:var(--bg);">
  <div class="print-page-wrapper">
    <div class="print-actions">
      <a class="btn" href="{{ url_for('admin') }}">← Back to Dashboard</a>
      <button class="btn primary" onclick="window.print()">🖨️ Print Physical Tag</button>
    </div>

    <div class="qr-physical-tag">
      <div class="tag-header">
        <div class="tag-brand">TCELABLINK · LABORATORY INVENTORY</div>
        <div class="tag-code">{{ item.id }}</div>
        <h1 class="tag-title">{{ item.name }}</h1>
      </div>

      <div class="qr-large-frame">
        <img src="{{ url_for('qr_image', eid=item.id) }}" alt="QR Code for {{ item.id }}">
      </div>

      <div class="tag-meta">
        <div><strong>Location:</strong> {{ item.location }}</div>
        <div><strong>Category:</strong> {{ item.category }}</div>
        {% if item.model %}<div><strong>Model:</strong> {{ item.model }}</div>{% endif %}
      </div>

      <div class="tag-instructions">
        Scan with technician mobile unit to open equipment audit record
      </div>
    </div>
  </div>
</body>

</html>
